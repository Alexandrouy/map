<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта участков и домов</title>

  <script src="https://api-maps.yandex.ru/2.1/?apikey=065d6c4c-73e3-4f3a-be43-e2ccef65e3bc&lang=ru_RU"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    /* ... (стили без изменений, оставьте свои) ... */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; }
    #sidePanel {
      position: fixed;
      top: 0;
      left: -440px;
      width: 420px;
      height: 100%;
      background: #fff;
      box-shadow: 2px 0 15px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #sidePanel.active { left: 0; }
    #sidePanel h2 {
      font-size: 20px;
      margin-bottom: 8px;
      border-bottom: 2px solid #1e88e5;
      padding-bottom: 10px;
      color: #1e88e5;
    }
    .field { display: flex; flex-direction: column; margin-bottom: 10px; }
    .field label { font-weight: 600; font-size: 14px; color: #555; margin-bottom: 3px; }
    .field input, .field textarea {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      background: #fafafa;
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field .value {
      padding: 6px 10px;
      background: #f5f5f5;
      border-radius: 4px;
      min-height: 30px;
      word-break: break-word;
      border-left: 3px solid #1e88e5;
    }
    .edit-mode .value { display: none; }
    .edit-mode input, .edit-mode textarea { display: block; }
    .view-mode input, .view-mode textarea { display: none; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      font-size: 14px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #1e88e5; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-danger { background: #e53935; color: #fff; }
    .btn-danger:hover { background: #c62828; }
    .btn-success { background: #43a047; color: #fff; }
    .btn-success:hover { background: #2e7d32; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-secondary:hover { background: #bdbdbd; }
    .btn-share { background: #ff9800; color: #fff; }
    .btn-share:hover { background: #f57c00; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }
    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    #sellerBlock {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #eee;
    }
    #sellerBlock .seller-fields { display: none; margin-top: 8px; }
    #sellerBlock .seller-fields.open { display: block; }
    .photo-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .photo-gallery img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #ddd;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .photo-gallery img:hover { transform: scale(1.05); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .video-container iframe { width: 100%; max-width: 100%; border-radius: 4px; }
    #photoModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    #photoModal.active { display: flex; }
    #photoModal img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    #photoModal .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.3);
      color: #fff;
      border: none;
      font-size: 40px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    #photoModal .nav-btn:hover { background: rgba(255,255,255,0.5); }
    #photoModal .nav-btn.prev { left: 20px; }
    #photoModal .nav-btn.next { right: 20px; }
    #photoModal .close-modal {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
    }
    #addModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }
    #addModal.active { display: flex; }
    #addModal .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      max-width: 550px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #addModal .modal-content h2 { margin-bottom: 20px; color: #1e88e5; }
    #addModal .modal-content .field { margin-bottom: 12px; }
    #addModal .modal-content .field label { display: block; font-weight: 600; margin-bottom: 3px; }
    #addModal .modal-content .field input,
    #addModal .modal-content .field textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #addModal .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .radio-group label {
      display: inline-block;
      margin-right: 15px;
      font-weight: normal;
      vertical-align: middle;
    }
    .radio-group input[type="radio"] {
      vertical-align: middle;
      margin-right: 4px;
    }
    .file-upload-wrapper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .file-upload-wrapper input[type="file"] { flex: 1; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 768px) {
      #sidePanel { width: 100%; left: -100%; }
      #sidePanel.active { left: 0; }
    }
  </style>
</head>
<body>
  <!-- Вся разметка (HTML) остаётся как в прошлом файле, без изменений -->
  <div id="map"></div>
  <div id="sidePanel">...</div>
  <div id="photoModal">...</div>
  <div id="addModal">...</div>
  <div id="toast" class="toast">Ссылка скопирована!</div>

  <script>
    // ============================================================
    // ВСЕ ПЕРЕМЕННЫЕ И КОНФИГИ (как в прошлом файле)
    // ============================================================
    var myMap, currentKey = null, currentData = null, isEditMode = false, markers = {}, photoModalIndex = 0, photoList = [], addCoords = null;
    var IMGBB_API_KEY = 'ebaa9a423b60ff4da24d4a2ef27722b6';
    var TYPE_LABELS = { land: 'Земельный участок', building: 'Строящийся дом', built: 'Построенный дом' };
    var TYPE_PRESETS = { land: 'islands#greenIcon', building: 'islands#yellowIcon', built: 'islands#redIcon' };

    var firebaseConfig = {
      apiKey: "AIzaSyBpP14wiDqjssdYujQM709uEJg5BNCdpps",
      authDomain: "reestr-obektov.firebaseapp.com",
      databaseURL: "https://reestr-obektov-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "reestr-obektov",
      storageBucket: "reestr-obektov.firebasestorage.app",
      messagingSenderId: "800962417269",
      appId: "1:800962417269:web:abe3a03947b0c620651e3c",
      measurementId: "G-52BGVJLH73"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var pointsRef = db.ref('points');

    // ============================================================
    // ФУНКЦИИ FIREBASE
    // ============================================================
    function loadPointsFromFirebase() { return new Promise(function(resolve, reject) { pointsRef.once('value', function(snapshot) { resolve(snapshot.val() || {}); }, reject); }); }
    function savePointToFirebase(key, data) { return pointsRef.child(key).set(data); }
    function deletePointFromFirebase(key) { return pointsRef.child(key).remove(); }

    // ============================================================
    // ЗАГРУЗКА ФОТО НА IMGBB
    // ============================================================
    function uploadToImgBB(file) {
      return new Promise(function(resolve, reject) {
        var formData = new FormData();
        formData.append('image', file);
        fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
          method: 'POST',
          body: formData
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (data.success) {
            resolve(data.data.url);
          } else {
            reject(new Error(data.error?.message || 'Ошибка загрузки на ImgBB'));
          }
        })
        .catch(function(err) { reject(err); });
      });
    }

    function uploadPhotos(files) {
      var promises = [];
      for (var i = 0; i < files.length; i++) {
        promises.push(uploadToImgBB(files[i]));
      }
      return Promise.all(promises);
    }

    // ============================================================
    // КАРТА И МАРКЕРЫ
    // ============================================================
    function renderAllMarkersFromData(data) {
      if (!myMap) return;
      myMap.geoObjects.removeAll();
      markers = {};
      for (var key in data) {
        if (data.hasOwnProperty(key)) {
          var point = data[key];
          if (point.lat && point.lng) {
            createMarker(key, point);
          }
        }
      }
    }
    function createMarker(key, point) {
      var type = point.type || 'land';
      var preset = TYPE_PRESETS[type] || 'islands#blueIcon';
      var label = TYPE_LABELS[type] || 'Объект';
      var placemark = new ymaps.Placemark([point.lat, point.lng],
        { balloonContent: '<b>' + label + '</b><br>' + (point.price || 'Участок') },
        { preset: preset });
      placemark.events.add('click', function() { openPanel(key); });
      myMap.geoObjects.add(placemark);
      markers[key] = placemark;
    }

    // ============================================================
    // БОКОВАЯ ПАНЕЛЬ (сокращённо, без изменений)
    // ============================================================
    function openPanel(key, dataFromSnapshot) {
      if (!dataFromSnapshot) {
        loadPointsFromFirebase().then(function(data) { if (data[key]) openPanel(key, data); else showToast('Объект не найден'); });
        return;
      }
      var point = dataFromSnapshot[key];
      if (!point) { alert('Объект не найден'); return; }
      currentKey = key;
      currentData = point;
      renderPanel(key, point);
      document.getElementById('sidePanel').classList.add('active');
      setEditMode(false);
    }
    function closePanel() {
      document.getElementById('sidePanel').classList.remove('active');
      currentKey = null;
      currentData = null;
      isEditMode = false;
    }
    function renderPanel(key, data) {
      // ... (полный код рендеринга панели - оставьте как в прошлом файле)
      // Мы не будем повторять его здесь, чтобы не загромождать ответ.
      // Убедитесь, что в вашем файле он полностью присутствует.
    }
    function setEditMode(enable) { /* ... */ }
    function updateHouseFieldsVisibility() { /* ... */ }

    // ============================================================
    // МОДАЛКА ДОБАВЛЕНИЯ
    // ============================================================
    function openAddModal(coords) {
      addCoords = coords;
      document.querySelector('input[name="addType"][value="land"]').checked = true;
      document.getElementById('addHouseFields').style.display = 'none';
      var fields = ['Price','Area','Cadastre','MapLink','Roads','Condition','Desc','Photos','Video','HouseArea','HouseMaterials','SellerName','SellerPhone','SellerEmail'];
      for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById('add' + fields[i]);
        if (el) el.value = '';
      }
      var photoInput = document.getElementById('addPhotoInput');
      if (photoInput) photoInput.value = '';
      document.getElementById('addModal').classList.add('active');
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      addCoords = null;
    }

    // ============================================================
    // ФОТО МОДАЛКА
    // ============================================================
    function openPhotoModal(photos, index) { /* ... */ }
    function closePhotoModal() { /* ... */ }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }
    function fallbackCopy(text) { /* ... */ }

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    ymaps.ready(function() {
      myMap = new ymaps.Map('map', { center: [55.76, 37.64], zoom: 10, controls: ['zoomControl', 'fullscreenControl'] });
      myMap.events.add('contextmenu', function(e) { e.preventDefault(); var coords = e.get('coords'); openAddModal(coords); });
      loadPointsFromFirebase().then(function(data) {
        renderAllMarkersFromData(data);
        var urlParams = new URLSearchParams(window.location.search);
        var pointKey = urlParams.get('point');
        if (pointKey && data[pointKey]) { setTimeout(function() { openPanel(pointKey, data); }, 300); }
      }).catch(function(err) { console.error(err); showToast('Не удалось загрузить данные'); });
      pointsRef.on('value', function(snapshot) {
        var data = snapshot.val() || {};
        renderAllMarkersFromData(data);
        if (currentKey && data[currentKey]) { currentData = data[currentKey]; renderPanel(currentKey, currentData); }
        else if (currentKey) { closePanel(); }
      });
    });

    // ============================================================
    // ОБРАБОТЧИКИ СОБЫТИЙ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      // ... (все остальные обработчики кнопок панели, share, delete и т.д.)

      // ========== НОВАЯ ВЕРСИЯ ЗАГРУЗКИ ФОТО ==========
      var addPhotoInput = document.getElementById('addPhotoInput');
      var addUploadBtn = document.getElementById('addUploadPhotosBtn');

      if (addUploadBtn) {
        addUploadBtn.addEventListener('click', function() {
          console.log('Кнопка "Загрузить фото" нажата');
          if (addPhotoInput) {
            addPhotoInput.click();
          } else {
            console.error('Элемент #addPhotoInput не найден');
          }
        });
      }

      if (addPhotoInput) {
        addPhotoInput.addEventListener('change', async function(e) {
          var files = e.target.files;
          console.log('Выбрано файлов:', files.length);
          if (!files.length) return;

          addUploadBtn.disabled = true;
          addUploadBtn.textContent = '⏳ Загрузка...';

          try {
            var urls = await uploadPhotos(files);
            console.log('Получены ссылки:', urls);

            var photosInput = document.getElementById('addPhotos');
            if (photosInput) {
              var current = photosInput.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
              var newUrls = current.concat(urls);
              photosInput.value = newUrls.join(', ');
              showToast('✅ Загружено ' + urls.length + ' фото');
            }
          } catch (err) {
            console.error('Ошибка загрузки фото:', err);
            showToast('❌ Ошибка загрузки фото: ' + err.message);
          } finally {
            addUploadBtn.disabled = false;
            addUploadBtn.textContent = '📤 Загрузить';
            addPhotoInput.value = '';
          }
        });
      }

      // Обработчик для кнопки "Сохранить" в модалке добавления
      var addSaveBtn = document.getElementById('addSaveBtn');
      if (addSaveBtn) {
        addSaveBtn.addEventListener('click', async function() {
          if (!addCoords) { alert('Координаты не определены'); return; }
          var type = document.querySelector('input[name="addType"]:checked').value;
          var newPoint = {
            lat: addCoords[0],
            lng: addCoords[1],
            type: type,
            price: document.getElementById('addPrice').value.trim(),
            area: document.getElementById('addArea').value.trim(),
            cadastre: document.getElementById('addCadastre').value.trim(),
            mapLink: document.getElementById('addMapLink').value.trim(),
            roads: document.getElementById('addRoads').value.trim(),
            condition: document.getElementById('addCondition').value.trim(),
            description: document.getElementById('addDesc').value.trim(),
            photos: document.getElementById('addPhotos').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean),
            video: document.getElementById('addVideo').value.trim(),
            houseArea: document.getElementById('addHouseArea').value.trim(),
            houseMaterials: document.getElementById('addHouseMaterials').value.trim(),
            seller: {
              name: document.getElementById('addSellerName').value.trim(),
              phone: document.getElementById('addSellerPhone').value.trim(),
              email: document.getElementById('addSellerEmail').value.trim()
            }
          };
          if (type === 'land') { newPoint.houseArea = ''; newPoint.houseMaterials = ''; }
          if (!newPoint.price && !newPoint.description) { alert('Заполните хотя бы цену или описание'); return; }
          try {
            var newKey = Date.now().toString();
            await savePointToFirebase(newKey, newPoint);
            closeAddModal();
            showToast('Объект добавлен!');
          } catch (err) {
            console.error(err);
            showToast('Ошибка добавления');
          }
        });
      }

      // Остальные обработчики (для панели, редактирования, удаления, фото-модалки)...
    });

    console.log('Карта с Firebase + ImgBB для фото запущена!');
  </script>
</body>
</html>
